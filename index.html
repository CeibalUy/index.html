<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taller El Yama</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: {
                            850: '#141e2e',
                            900: '#0f172a',
                            950: '#020617',
                        },
                        amber: {
                            400: '#fbbf24',
                            500: '#f59e0b',
                            600: '#d97706',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            overscroll-behavior-y: none;
        }

        input, textarea, select {
            font-size: 16px !important;
        }

        .custom-scrollbar::-webkit-scrollbar, ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a; 
        }
        ::-webkit-scrollbar-thumb {
            background: #334155; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569; 
        }

        #toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast {
            background-color: #1e293b;
            border-left: 4px solid #f59e0b;
            color: white;
            padding: 12px 20px;
            border-radius: 6px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            opacity: 0;
            transform: translateX(100%);
            transition: all 0.3s ease-out;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(0);
        }

        .spinner {
            border: 3px solid rgba(245, 158, 11, 0.3);
            border-radius: 50%;
            border-top: 3px solid #f59e0b;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .premium-shadow {
            box-shadow: 0 4px 20px -2px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
        }
        .premium-border {
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-950 premium-border border-b border-l-0 border-r-0 border-t-0 px-6 py-4 flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center gap-3 cursor-pointer" onclick="app.navigate('home')">
            <svg width="36" height="36" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" class="text-amber-500">
                <g transform="translate(50, 50) rotate(45) translate(-50, -50)">
                    <rect x="42" y="30" width="16" height="50" rx="3" fill="currentColor" opacity="0.8"/>
                    <circle cx="50" cy="80" r="12" stroke="currentColor" stroke-width="6" fill="#0f172a"/>
                    <path d="M35 15 C35 10, 40 5, 50 5 C60 5, 65 10, 65 15 L65 35 L35 35 Z" fill="currentColor"/>
                </g>
                <g transform="translate(50, 50) rotate(-45) translate(-50, -50)">
                    <rect x="42" y="30" width="16" height="50" rx="3" fill="currentColor" opacity="0.8"/>
                    <circle cx="50" cy="80" r="12" stroke="currentColor" stroke-width="6" fill="#0f172a"/>
                    <path d="M35 15 C35 10, 40 5, 50 5 C60 5, 65 10, 65 15 L65 35 L35 35 Z" fill="currentColor"/>
                </g>
                <circle cx="50" cy="50" r="6" fill="#0f172a" stroke="currentColor" stroke-width="3"/>
            </svg>
            <h1 class="text-2xl font-bold tracking-tight text-white">Taller <span class="text-amber-500">El Yama</span></h1>
        </div>
        <div class="flex items-center gap-3">
            <button id="nav-btn-back" onclick="app.goBack()" aria-label="Volver atrás" class="hidden bg-slate-800 hover:bg-slate-700 text-white w-10 h-10 rounded-lg border border-slate-700 transition-colors">
                <i class="fas fa-arrow-left"></i>
            </button>
            <button id="nav-btn-home" onclick="app.navigate('home')" class="text-slate-300 hover:text-white transition-colors hidden mr-1">Inicio</button>
            <button id="nav-btn-logout" onclick="app.logout()" class="text-red-400 hover:text-red-300 transition-colors hidden"><i class="fas fa-sign-out-alt mr-1"></i> Salir</button>
        </div>
    </header>

    <!-- Main Container -->
    <main id="app-container" class="flex-grow flex flex-col relative w-full h-full p-4 sm:p-6 lg:p-8 max-w-7xl mx-auto overflow-hidden">
    </main>

    <div id="toast-container"></div>

    <!-- Modal Ficha Técnica B/N -->
    <div id="ficha-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-[110] flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300 hidden">
        <div class="bg-slate-900 rounded-2xl premium-border premium-shadow w-full max-w-3xl max-h-[92vh] flex flex-col overflow-hidden">
            <div class="p-4 border-b border-slate-700 flex justify-between items-center bg-slate-950">
                <h3 class="font-bold text-lg text-white flex items-center gap-2">
                    <i class="fas fa-file-invoice text-amber-500"></i> Ficha Técnica
                </h3>
                <button onclick="app.closeFichaModal()" class="text-slate-400 hover:text-white transition-colors">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>

            <div class="p-6 overflow-y-auto flex-grow custom-scrollbar bg-slate-950" id="ficha-modal-body">
                <div id="ficha-tecnica-card" class="bg-white text-black p-6 rounded-xl border-2 border-black space-y-6 shadow-2xl font-sans">
                    <div class="flex justify-between items-start border-b-2 border-black pb-4">
                        <div>
                            <h2 class="text-2xl font-black tracking-tight text-black">TALLER EL YAMA</h2>
                            <p class="text-xs font-bold text-gray-700 tracking-wider uppercase mt-0.5">Ficha de Trabajo y Servis</p>
                        </div>
                        <div class="text-right text-xs font-semibold text-gray-800">
                            <p id="ft-date">Fecha: -</p>
                            <p class="font-mono mt-0.5">Ref: #YAMA-<span id="ft-ref">001</span></p>
                        </div>
                    </div>

                    <div class="grid grid-cols-3 gap-3 bg-gray-100 p-3 rounded-lg border border-black text-sm">
                        <div>
                            <span class="text-[10px] font-bold uppercase text-gray-600 block">Vehículo</span>
                            <strong id="ft-vehicle" class="text-black text-sm font-black break-words">-</strong>
                        </div>
                        <div>
                            <span class="text-[10px] font-bold uppercase text-gray-600 block">Cliente</span>
                            <strong id="ft-plate" class="text-black text-sm font-black break-words">-</strong>
                        </div>
                        <div>
                            <span class="text-[10px] font-bold uppercase text-gray-600 block">Kilometraje</span>
                            <strong id="ft-km" class="text-black text-sm font-black">-</strong>
                        </div>
                    </div>

                    <div class="space-y-2">
                        <h4 class="text-black text-xs font-black uppercase tracking-wider border-b border-black pb-1">
                            Mantenimiento / Servis
                        </h4>
                        <div id="ft-servis-list" class="grid grid-cols-1 gap-2 text-sm"></div>
                    </div>

                    <div class="space-y-2">
                        <h4 class="text-black text-xs font-black uppercase tracking-wider border-b border-black pb-1">
                            Reparaciones y Trabajos
                        </h4>
                        <div id="ft-reparaciones-list" class="grid grid-cols-1 gap-2 text-sm"></div>
                    </div>

                    <div id="ft-notes-container" class="bg-gray-50 p-3 rounded-lg border border-gray-400 text-xs text-black">
                        <span class="font-bold uppercase tracking-wide block mb-1 text-gray-800">Observaciones:</span>
                        <p id="ft-notes" class="whitespace-pre-wrap leading-relaxed text-gray-900">-</p>
                    </div>

                    <div class="text-center pt-3 border-t border-black text-xs font-bold text-gray-700">
                        Taller El Yama
                    </div>
                </div>
            </div>

            <div class="p-4 border-t border-slate-700 bg-slate-950 flex flex-wrap justify-center sm:justify-end gap-3">
                <button type="button" onclick="app.generateFichaImage()" class="px-4 py-2.5 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold text-sm rounded-xl transition-all flex items-center gap-2 shadow-lg">
                    <i class="fas fa-file-image"></i> Generar Imagen B/N
                </button>

                <button type="button" id="btn-view-image" onclick="app.openImageViewer()" class="px-4 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-sm rounded-xl border border-slate-600 transition-all flex items-center gap-2 opacity-50 cursor-not-allowed pointer-events-none">
                    <i class="fas fa-eye text-blue-400"></i> Ver Imagen
                </button>

                <button type="button" id="btn-share-whatsapp" onclick="app.shareFichaImageWhatsApp()" class="px-4 py-2.5 bg-green-600 hover:bg-green-500 text-white font-bold text-sm rounded-xl transition-all flex items-center gap-2 shadow-lg opacity-50 cursor-not-allowed pointer-events-none">
                    <i class="fab fa-whatsapp text-lg"></i> Enviar por WhatsApp
                </button>
            </div>
        </div>
    </div>

    <!-- Modal Visor Imagen -->
    <div id="image-viewer-modal" class="fixed inset-0 bg-black/90 backdrop-blur-lg z-[120] flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300 hidden">
        <div class="bg-slate-900 rounded-2xl premium-border premium-shadow w-full max-w-2xl max-h-[92vh] flex flex-col overflow-hidden">
            <div class="p-4 border-b border-slate-700 flex justify-between items-center bg-slate-950">
                <h3 class="font-bold text-lg text-white flex items-center gap-2">
                    <i class="fas fa-image text-amber-500"></i> Vista Previa
                </h3>
                <button onclick="app.closeImageViewer()" class="text-slate-400 hover:text-white transition-colors">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <div class="p-4 overflow-y-auto flex items-center justify-center flex-grow bg-slate-950/50">
                <img id="viewer-img" src="" alt="Ficha Técnica Generada" class="max-w-full max-h-[70vh] rounded-xl border border-slate-700 shadow-2xl object-contain bg-white">
            </div>
            <div class="p-4 border-t border-slate-700 bg-slate-950 flex justify-end gap-3">
                <button type="button" onclick="app.downloadGeneratedImage()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white font-medium text-sm rounded-lg border border-slate-600 transition-colors flex items-center gap-2">
                    <i class="fas fa-download text-amber-500"></i> Descargar
                </button>
                <button type="button" onclick="app.closeImageViewer()" class="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold text-sm rounded-lg transition-colors">
                    Cerrar
                </button>
            </div>
        </div>
    </div>

    <!-- Templates -->
    <template id="tpl-home">
        <div class="flex-grow flex flex-col items-center justify-center animate-fade-in">
            <div class="text-center mb-10">
                <h2 class="text-3xl sm:text-5xl font-bold mb-3">Taller <span class="text-amber-500">El Yama</span></h2>
                <p class="text-slate-400 text-base max-w-md mx-auto">Selecciona tu perfil para ingresar.</p>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full max-w-3xl">
                <button type="button" onclick="app.navigate('client')" class="bg-slate-800 hover:bg-slate-700 premium-border premium-shadow rounded-2xl p-8 flex flex-col items-center text-center transition-all">
                    <div class="w-16 h-16 bg-slate-900 rounded-full flex items-center justify-center mb-4">
                        <i class="fas fa-car text-3xl text-amber-500"></i>
                    </div>
                    <h3 class="text-xl font-bold text-white mb-1">Cliente</h3>
                    <p class="text-slate-400 text-sm">Consultar estado del vehículo.</p>
                </button>

                <button type="button" onclick="app.navigate('login')" class="bg-slate-800 hover:bg-slate-700 premium-border premium-shadow rounded-2xl p-8 flex flex-col items-center text-center transition-all">
                    <div class="w-16 h-16 bg-slate-900 rounded-full flex items-center justify-center mb-4">
                        <i class="fas fa-wrench text-3xl text-amber-500"></i>
                    </div>
                    <h3 class="text-xl font-bold text-white mb-1">Mecánico</h3>
                    <p class="text-slate-400 text-sm">Gestión de trabajos y fichas.</p>
                </button>
            </div>
        </div>
    </template>

    <template id="tpl-client">
        <div class="w-full animate-fade-in flex flex-col h-full">
            <div class="flex items-center justify-between mb-6">
                <div>
                    <h2 class="text-2xl font-bold text-white"><i class="fas fa-car-side text-amber-500 mr-2"></i>Vehículos en Taller</h2>
                </div>
                <button type="button" onclick="app.navigate('home')" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-lg premium-border text-sm"><i class="fas fa-arrow-left mr-1"></i> Volver</button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="client-cars-list"></div>
            
            <div id="client-empty-state" class="hidden flex-col items-center justify-center py-20 text-slate-500">
                <i class="fas fa-box-open text-5xl mb-3 opacity-50"></i>
                <p>No hay vehículos actualmente en el taller.</p>
            </div>
        </div>
    </template>

    <template id="tpl-login">
        <div class="flex-grow flex items-center justify-center animate-fade-in">
            <div class="bg-slate-800 premium-border premium-shadow rounded-2xl p-8 w-full max-w-md">
                <div class="text-center mb-6">
                    <div class="w-14 h-14 bg-slate-900 rounded-full flex items-center justify-center mx-auto mb-3">
                        <i class="fas fa-lock text-xl text-amber-500"></i>
                    </div>
                    <h2 class="text-xl font-bold text-white">Ingreso al Panel</h2>
                </div>
                
                <form id="login-form" onsubmit="app.handleLogin(event)" class="space-y-4">
                    <div>
                        <label for="password" class="block text-sm font-medium text-slate-300 mb-1">Contraseña</label>
                        <input type="password" id="password" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-white focus:border-amber-500 outline-none" placeholder="••••••••">
                        <p id="login-error" class="text-red-400 text-sm mt-2 hidden"><i class="fas fa-exclamation-circle mr-1"></i> Contraseña incorrecta.</p>
                    </div>
                    
                    <div class="flex items-center">
                        <input id="remember-me" type="checkbox" class="w-4 h-4 accent-amber-500 bg-slate-900 border-slate-700 rounded cursor-pointer">
                        <label for="remember-me" class="ml-2 text-sm text-slate-300 cursor-pointer">Mantener sesión iniciada</label>
                    </div>

                    <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 px-4 rounded-lg transition-colors mt-2">
                        Ingresar
                    </button>
                </form>
            </div>
        </div>
    </template>

    <template id="tpl-mechanic">
        <div class="w-full flex flex-col h-full animate-fade-in gap-6">
            
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-slate-800 p-5 rounded-2xl premium-border">
                <div>
                    <h2 class="text-2xl font-bold text-white"><i class="fas fa-cogs text-amber-500 mr-2"></i>Panel del Mecánico</h2>
                </div>
                <button type="button" onclick="app.toggleCarModal()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-5 py-2.5 rounded-lg transition-colors flex items-center gap-2 shadow-lg">
                    <i class="fas fa-plus"></i> Nuevo Vehículo
                </button>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 flex-grow min-h-0">
                <div class="lg:col-span-2 bg-slate-800 rounded-2xl premium-border flex flex-col h-[550px] lg:h-auto overflow-hidden">
                    <div class="p-4 border-b border-slate-700 bg-slate-850">
                        <h3 class="font-semibold text-base"><i class="fas fa-list-ul mr-2 text-slate-400"></i>Listado de Vehículos</h3>
                    </div>
                    <div class="p-4 overflow-y-auto flex-grow space-y-4 custom-scrollbar" id="mechanic-cars-list"></div>
                     <div id="mechanic-empty-state" class="hidden flex-col items-center justify-center py-20 text-slate-500 h-full">
                        <i class="fas fa-clipboard-list text-5xl mb-3 opacity-50"></i>
                        <p>No hay vehículos registrados.</p>
                    </div>
                </div>

                <div class="bg-slate-800 rounded-2xl premium-border flex flex-col h-[550px] lg:h-auto overflow-hidden border-t-4 border-t-amber-500">
                    <div class="p-4 border-b border-slate-700 bg-slate-850">
                        <h3 class="font-semibold text-base flex items-center"><i class="fas fa-robot text-amber-500 mr-2"></i>Asistente del Taller</h3>
                    </div>
                    
                    <div class="flex-grow overflow-y-auto p-4 space-y-3 flex flex-col custom-scrollbar" id="chat-messages">
                        <div class="flex flex-col items-start">
                            <div class="bg-slate-700 text-white rounded-2xl rounded-tl-sm px-4 py-2.5 max-w-[85%] text-sm">
                                Hola Yama, ¿en qué te puedo ayudar hoy?
                            </div>
                        </div>
                    </div>
                    
                    <div class="p-3 border-t border-slate-700 bg-slate-850">
                        <form id="chat-form" onsubmit="app.handleChat(event)" class="flex gap-2 relative">
                            <input type="text" id="chat-input" placeholder="Consultar repuesto, falla..." class="w-full bg-slate-900 border border-slate-700 rounded-full pl-4 pr-10 py-2 text-white focus:border-amber-500 outline-none text-sm" autocomplete="off" required>
                            <button type="submit" id="chat-submit-btn" class="absolute right-1 top-1 bottom-1 w-8 h-8 flex items-center justify-center bg-amber-500 text-slate-950 rounded-full hover:bg-amber-600 transition-colors">
                                <i class="fas fa-paper-plane text-xs"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modal Agregar/Editar -->
        <div id="car-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-[100] flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300 hidden">
            <div class="bg-slate-800 rounded-2xl premium-border premium-shadow w-full max-w-3xl max-h-[90vh] flex flex-col transform scale-95 transition-transform duration-300" id="car-modal-content">
                <div class="p-5 border-b border-slate-700 flex justify-between items-center bg-slate-850 rounded-t-2xl">
                    <h3 class="font-bold text-lg text-white" id="modal-title">Registrar Nuevo Vehículo</h3>
                    <button type="button" onclick="app.toggleCarModal()" class="text-slate-400 hover:text-white transition-colors">
                        <i class="fas fa-times text-xl"></i>
                    </button>
                </div>
                
                <div class="p-6 overflow-y-auto space-y-5 custom-scrollbar">
                    <form id="car-form" onsubmit="app.saveCar(event)" class="space-y-5">
                        <input type="hidden" id="car-id">
                        
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-300 mb-1">Marca *</label>
                                <input type="text" id="car-brand" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-amber-500 outline-none" placeholder="Ej: Toyota">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-300 mb-1">Modelo *</label>
                                <input type="text" id="car-model" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-amber-500 outline-none" placeholder="Ej: Corolla">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-300 mb-1">Nombre del Cliente *</label>
                                <input type="text" id="car-plate" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-amber-500 outline-none" placeholder="Ej: Juan Pérez">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-300 mb-1">Kilometraje</label>
                                <input type="number" id="car-km" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-amber-500 outline-none" placeholder="Ej: 45000">
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-1">Estado del Trabajo *</label>
                            <select id="car-status" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-amber-500 outline-none">
                                <option value="En espera">En espera</option>
                                <option value="En proceso">En proceso</option>
                                <option value="Terminado">Terminado</option>
                            </select>
                        </div>

                        <!-- Lista de Opciones -->
                        <div class="border-t border-slate-700 pt-4 space-y-4">
                            <h4 class="text-sm font-bold text-amber-400">Servis y Reparaciones</h4>

                            <div class="flex flex-col sm:flex-row gap-2">
                                <input type="text" id="custom-task-input" placeholder="Agregar tarea personalizada..." class="flex-grow bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:border-amber-500 outline-none">
                                <div class="flex gap-2">
                                    <select id="custom-task-cat" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white outline-none">
                                        <option value="servis">Servis</option>
                                        <option value="reparaciones">Reparación</option>
                                    </select>
                                    <button type="button" onclick="app.addCustomChecklistItem()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-4 py-2 rounded-lg text-sm whitespace-nowrap">
                                        + Agregar
                                    </button>
                                </div>
                            </div>

                            <div id="checklist-container" class="space-y-4 max-h-[280px] overflow-y-auto pr-1 custom-scrollbar">
                                <div class="bg-slate-900/60 rounded-xl p-3 border border-slate-750">
                                    <h5 class="text-xs font-bold uppercase text-slate-400 mb-2">SERVIS (Aceite y Filtros)</h5>
                                    <div class="space-y-2" id="checklist-servis-items"></div>
                                </div>

                                <div class="bg-slate-900/60 rounded-xl p-3 border border-slate-750">
                                    <h5 class="text-xs font-bold uppercase text-slate-400 mb-2">REPARACIONES</h5>
                                    <div class="space-y-2" id="checklist-reparaciones-items"></div>
                                </div>
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-1">Notas u Observaciones</label>
                            <textarea id="car-notes" rows="2" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-amber-500 outline-none resize-none" placeholder="Detalles de fallas o aclaraciones..."></textarea>
                        </div>
                    </form>
                </div>
                
                <div class="p-4 border-t border-slate-700 bg-slate-850 rounded-b-2xl flex items-center justify-end gap-3">
                    <button type="button" onclick="app.toggleCarModal()" class="px-4 py-2 bg-transparent text-slate-300 hover:text-white rounded-lg border border-slate-600 text-sm">
                        Cancelar
                    </button>
                    <button type="submit" form="car-form" class="px-5 py-2 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold rounded-lg text-sm shadow-lg">
                        Guardar
                    </button>
                </div>
            </div>
        </div>
    </template>

    <script type="module">
        const userFirebaseConfig = {
            apiKey: "AIzaSyB4rgiSCDlaqmt26zTwXLzwDtMCQJvtJC4",
            authDomain: "taller-8f0fc.firebaseapp.com",
            projectId: "taller-8f0fc",
            storageBucket: "taller-8f0fc.firebasestorage.app",
            messagingSenderId: "481689410274",
            appId: "1:481689410274:web:7715ad7e058cd95de69cbb",
            measurementId: "G-RJX4LHMYVT"
        }; 

        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const DEFAULT_CHECKLIST = [
            { id: 'item_aceite', text: 'Cambio de Aceite', category: 'servis', selected: false, status: 'pendiente' },
            { id: 'item_filtro_aceite', text: 'Filtro de Aceite', category: 'servis', selected: false, status: 'pendiente' },
            { id: 'item_filtro_combustible', text: 'Filtro de Combustible', category: 'servis', selected: false, status: 'pendiente' },
            { id: 'item_filtro_aire_motor', text: 'Filtro de Aire Motor', category: 'servis', selected: false, status: 'pendiente' },
            { id: 'item_filtro_aire_habitaculo', text: 'Filtro de Aire Habitáculo', category: 'servis', selected: false, status: 'pendiente' },
            { id: 'item_intervalo_10k', text: 'Servis Cada 10.000 Km', category: 'servis', selected: false, status: 'pendiente' },
            { id: 'item_intervalo_5k', text: 'Servis Cada 5.000 Km', category: 'servis', selected: false, status: 'pendiente' },
            { id: 'item_distribucion', text: 'Cambio de Distribución (Correa / Cadena)', category: 'reparaciones', selected: false, status: 'pendiente' },
            { id: 'item_liquido_caja', text: 'Líquido de Caja de Cambios', category: 'reparaciones', selected: false, status: 'pendiente' }
        ];

        class App {
            constructor() {
                this.state = {
                    currentView: 'home',
                    isLoggedIn: false,
                    cars: [],
                    isOnline: false,
                    db: null,
                    auth: null,
                    unsubscribe: null,
                    chatHistory: [],
                    activeChecklist: JSON.parse(JSON.stringify(DEFAULT_CHECKLIST)),
                    activeFichaCar: null,
                    generatedImage: null
                };

                this.container = document.getElementById('app-container');
                this.toastContainer = document.getElementById('toast-container');
                
                this.navigate = this.navigate.bind(this);
                this.handleLogin = this.handleLogin.bind(this);
                this.toggleCarModal = this.toggleCarModal.bind(this);
                this.saveCar = this.saveCar.bind(this);
                this.deleteCar = this.deleteCar.bind(this);
                this.editCar = this.editCar.bind(this);
                this.updateCarStatus = this.updateCarStatus.bind(this);
                this.handleChat = this.handleChat.bind(this);
                
                this.initCloudServices();
                this.navigate('home');
            }

            async initCloudServices() {
                try {
                    const firebaseApp = initializeApp(userFirebaseConfig);
                    this.state.auth = getAuth(firebaseApp);
                    this.state.db = getFirestore(firebaseApp);
                    await signInAnonymously(this.state.auth);
                    this.subscribeToCars();
                } catch (error) {
                    this.fallbackToOffline("Modo sin conexión.");
                }
            }

            fallbackToOffline(message) {
                this.state.isOnline = false;
                this.state.cars = [];
                if (this.state.unsubscribe) {
                    this.state.unsubscribe();
                    this.state.unsubscribe = null;
                }
                this.showToast(message, "error");
                if (this.state.currentView === 'client' || this.state.currentView === 'mechanic') {
                    this.renderCurrentView();
                }
            }

            getCollectionRef() {
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'taller-el-yama';
                return collection(this.state.db, 'artifacts', appId, 'public', 'data', 'cars');
            }

            subscribeToCars() {
                if (!this.state.auth || !this.state.auth.currentUser || !this.state.db) return;
                if (this.state.unsubscribe) this.state.unsubscribe();

                const colRef = this.getCollectionRef();
                this.state.unsubscribe = onSnapshot(colRef, (snapshot) => {
                    this.state.isOnline = true;
                    this.state.cars = snapshot.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data()
                    })).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

                    if (this.state.currentView === 'client' || this.state.currentView === 'mechanic') {
                        this.renderCurrentView();
                    }
                }, () => {
                    this.state.isOnline = false;
                });
            }

            navigate(view) {
                if (view === 'login' && localStorage.getItem('yama_logged_in') === 'true') {
                    this.state.isLoggedIn = true;
                    view = 'mechanic';
                }

                if (view === 'mechanic' && !this.state.isLoggedIn) {
                    view = 'login';
                }
                
                this.state.currentView = view;
                this.renderCurrentView();
                
                const navBtnBack = document.getElementById('nav-btn-back');
                const navBtnHome = document.getElementById('nav-btn-home');
                const navBtnLogout = document.getElementById('nav-btn-logout');

                if (view === 'home') {
                    navBtnBack.classList.add('hidden');
                    navBtnHome.classList.add('hidden');
                    navBtnLogout.classList.add('hidden');
                } else {
                    navBtnBack.classList.remove('hidden');
                    navBtnHome.classList.remove('hidden');
                    if (this.state.isLoggedIn && view === 'mechanic') {
                        navBtnLogout.classList.remove('hidden');
                    } else {
                        navBtnLogout.classList.add('hidden');
                    }
                }
            }

            goBack() {
                this.navigate('home');
            }

            logout() {
                this.state.isLoggedIn = false;
                localStorage.removeItem('yama_logged_in');
                this.navigate('home');
                this.showToast("Sesión cerrada", "success");
            }

            renderCurrentView() {
                this.container.innerHTML = '';
                const template = document.getElementById(`tpl-${this.state.currentView}`);
                if (template) {
                    this.container.appendChild(template.content.cloneNode(true));
                    if (this.state.currentView === 'client') this.renderClientCars();
                    if (this.state.currentView === 'mechanic') this.renderMechanicCars();
                }
            }

            renderClientCars() {
                const listEl = document.getElementById('client-cars-list');
                const emptyEl = document.getElementById('client-empty-state');
                if (!listEl) return;
                listEl.innerHTML = '';
                
                if (this.state.cars.length === 0) {
                    listEl.classList.add('hidden');
                    emptyEl.classList.remove('hidden');
                    emptyEl.classList.add('flex');
                    return;
                }
                
                listEl.classList.remove('hidden');
                emptyEl.classList.add('hidden');

                this.state.cars.forEach(car => {
                    const statusColor = this.getStatusColor(car.status);
                    const card = document.createElement('div');
                    card.className = "bg-slate-800 rounded-2xl p-5 premium-border relative flex flex-col h-full";
                    
                    let tasksHtml = '';
                    if (car.checklist && car.checklist.length > 0) {
                        const selectedTasks = car.checklist.filter(item => item.selected);
                        if (selectedTasks.length > 0) {
                            tasksHtml += `<div class="mt-3 pt-3 border-t border-slate-700 flex-grow"><div class="space-y-1.5 max-h-40 overflow-y-auto custom-scrollbar">`;
                            selectedTasks.forEach(task => {
                                const isComplete = task.status === 'completa';
                                tasksHtml += `
                                    <div class="flex justify-between items-start text-xs bg-slate-900/60 p-2 rounded border border-slate-700/50 gap-2">
                                        <span class="text-slate-200 break-words flex-grow">${task.text}</span>
                                        <span class="font-bold px-1.5 py-0.5 rounded text-[10px] whitespace-nowrap flex-shrink-0 ${isComplete ? 'bg-green-500/20 text-green-400' : 'bg-amber-500/20 text-amber-400'}">
                                            ${isComplete ? 'COMPLETA' : 'PENDIENTE'}
                                        </span>
                                    </div>`;
                            });
                            tasksHtml += `</div></div>`;
                        }
                    }

                    let notesHtml = car.notes ? `
                        <div class="mt-3 bg-slate-900/80 p-3 rounded-xl border border-slate-700 text-xs text-slate-300">
                            <span class="font-bold text-amber-400 block mb-1">Observaciones:</span>
                            <div class="whitespace-pre-wrap leading-relaxed">${car.notes}</div>
                        </div>` : '';

                    card.innerHTML = `
                        <div class="flex justify-between items-start mb-3">
                            <div>
                                <h3 class="text-lg font-bold text-white break-words">${car.brand} ${car.model}</h3>
                                <div class="text-xs text-slate-300 mt-1"><i class="fas fa-user text-slate-500 mr-1"></i> ${car.plate}</div>
                            </div>
                            <span class="px-2.5 py-1 rounded-full text-xs font-bold ${statusColor.badgeBg} ${statusColor.badgeText}">
                                ${car.status}
                            </span>
                        </div>
                        ${tasksHtml}
                        ${notesHtml}
                    `;
                    listEl.appendChild(card);
                });
            }

            handleLogin(e) {
                e.preventDefault();
                const passInput = document.getElementById('password');
                const rememberMe = document.getElementById('remember-me');
                
                if (passInput.value === 'Yamandu') {
                    this.state.isLoggedIn = true;
                    if (rememberMe && rememberMe.checked) {
                        localStorage.setItem('yama_logged_in', 'true');
                    }
                    this.navigate('mechanic');
                    this.showToast("Acceso concedido", "success");
                } else {
                    document.getElementById('login-error').classList.remove('hidden');
                }
            }

            renderMechanicCars() {
                const listEl = document.getElementById('mechanic-cars-list');
                const emptyEl = document.getElementById('mechanic-empty-state');
                if (!listEl) return;
                listEl.innerHTML = '';
                
                if (this.state.cars.length === 0) {
                    emptyEl.classList.remove('hidden');
                    emptyEl.classList.add('flex');
                    return;
                }
                emptyEl.classList.add('hidden');

                this.state.cars.forEach(car => {
                    const statusColor = this.getStatusColor(car.status);
                    const item = document.createElement('div');
                    item.className = "bg-slate-900 border border-slate-700 rounded-xl p-4 flex flex-col gap-3 relative overflow-hidden";
                    
                    item.innerHTML = `
                        <div class="absolute left-0 top-0 bottom-0 w-1 ${statusColor.bg}"></div>
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 ml-1">
                            <div class="flex-grow min-w-0">
                                <h4 class="font-bold text-white text-base break-words">${car.brand} ${car.model}</h4>
                                <div class="flex items-center gap-2 text-xs mt-1 text-slate-400 flex-wrap">
                                    <span class="bg-slate-800 px-2 py-0.5 rounded border border-slate-700 text-amber-400 font-bold break-words"><i class="fas fa-user text-slate-500 mr-1"></i> ${car.plate}</span>
                                    ${car.km ? `<span>${car.km} km</span>` : ''}
                                </div>
                            </div>
                            <div class="flex items-center gap-2 w-full sm:w-auto justify-end flex-wrap sm:flex-nowrap">
                                <button type="button" onclick="app.openFichaModal('${car.id}')" class="px-3 py-1.5 bg-amber-500/20 text-amber-400 hover:bg-amber-500/30 rounded-lg border border-amber-500/30 text-xs font-semibold flex items-center gap-1">
                                    <i class="fas fa-file-invoice"></i> Ficha
                                </button>
                                <select onchange="app.updateCarStatus('${car.id}', this.value)" class="bg-slate-800 border border-slate-600 rounded-lg px-2 py-1 text-xs text-white outline-none">
                                    <option value="En espera" ${car.status === 'En espera' ? 'selected' : ''}>En espera</option>
                                    <option value="En proceso" ${car.status === 'En proceso' ? 'selected' : ''}>En proceso</option>
                                    <option value="Terminado" ${car.status === 'Terminado' ? 'selected' : ''}>Terminado</option>
                                </select>
                                <button type="button" onclick="app.editCar('${car.id}')" class="p-1.5 text-blue-400 hover:text-blue-300" title="Editar"><i class="fas fa-edit"></i></button>
                                <button type="button" onclick="app.deleteCar('${car.id}')" class="p-1.5 text-red-400 hover:text-red-300" title="Eliminar"><i class="fas fa-trash-alt"></i></button>
                            </div>
                        </div>
                        ${car.notes ? `<div class="ml-1 bg-slate-850 rounded-lg p-2.5 text-xs text-slate-300 border border-slate-700 break-words">${car.notes}</div>` : ''}
                    `;
                    listEl.appendChild(item);
                });
            }

            toggleCarModal() {
                const modal = document.getElementById('car-modal');
                const modalContent = document.getElementById('car-modal-content');
                if (!modal) return;

                if (modal.classList.contains('hidden')) {
                    document.getElementById('car-form').reset();
                    document.getElementById('car-id').value = '';
                    document.getElementById('modal-title').textContent = 'Registrar Nuevo Vehículo';
                    this.state.activeChecklist = JSON.parse(JSON.stringify(DEFAULT_CHECKLIST));
                    this.renderChecklistUI();
                    
                    modal.classList.remove('hidden');
                    setTimeout(() => {
                        modal.classList.remove('opacity-0', 'pointer-events-none');
                        modalContent.classList.remove('scale-95');
                        modalContent.classList.add('scale-100');
                    }, 10);
                } else {
                    modal.classList.add('opacity-0', 'pointer-events-none');
                    modalContent.classList.remove('scale-100');
                    modalContent.classList.add('scale-95');
                    setTimeout(() => modal.classList.add('hidden'), 300);
                }
            }

            renderChecklistUI() {
                const servisBox = document.getElementById('checklist-servis-items');
                const reparacionesBox = document.getElementById('checklist-reparaciones-items');
                if (!servisBox || !reparacionesBox) return;

                servisBox.innerHTML = '';
                reparacionesBox.innerHTML = '';

                this.state.activeChecklist.forEach(item => {
                    const row = document.createElement('div');
                    row.className = "flex items-start justify-between gap-2 bg-slate-800/80 p-2.5 rounded-lg border border-slate-700 text-xs";
                    
                    row.innerHTML = `
                        <div class="flex items-start gap-2 flex-grow min-w-0 pt-0.5">
                            <input type="checkbox" id="chk-${item.id}" ${item.selected ? 'checked' : ''} onchange="app.toggleChecklistItem('${item.id}', this.checked)" class="w-4 h-4 rounded accent-amber-500 cursor-pointer flex-shrink-0 mt-0.5">
                            <label for="chk-${item.id}" class="text-white cursor-pointer break-words w-full ${item.selected ? 'font-semibold' : 'text-slate-300'}">${item.text}</label>
                        </div>
                        <div class="flex items-center gap-1 flex-shrink-0">
                            <select onchange="app.updateChecklistStatus('${item.id}', this.value)" class="bg-slate-900 border ${item.status === 'pendiente' ? 'border-amber-500/50 text-amber-400' : 'border-green-500/50 text-green-400'} rounded px-2 py-1 text-[11px]">
                                <option value="pendiente" ${item.status === 'pendiente' ? 'selected' : ''}>Pendiente</option>
                                <option value="completa" ${item.status === 'completa' ? 'selected' : ''}>Completa</option>
                            </select>
                            ${item.isCustom ? `<button type="button" onclick="app.removeCustomChecklistItem('${item.id}')" class="text-red-400 px-1"><i class="fas fa-trash"></i></button>` : ''}
                        </div>
                    `;

                    if (item.category === 'servis') {
                        servisBox.appendChild(row);
                    } else {
                        reparacionesBox.appendChild(row);
                    }
                });
            }

            toggleChecklistItem(id, selected) {
                const item = this.state.activeChecklist.find(i => i.id === id);
                if (item) {
                    item.selected = selected;
                    this.renderChecklistUI();
                }
            }

            updateChecklistStatus(id, status) {
                const item = this.state.activeChecklist.find(i => i.id === id);
                if (item) {
                    item.status = status;
                    if (status === 'completa') item.selected = true;
                    this.renderChecklistUI();
                }
            }

            addCustomChecklistItem() {
                const input = document.getElementById('custom-task-input');
                const catSelect = document.getElementById('custom-task-cat');
                const val = input.value.trim();

                if (!val) return;

                this.state.activeChecklist.push({
                    id: 'custom_' + Date.now(),
                    text: val,
                    category: catSelect.value,
                    selected: true,
                    status: 'pendiente',
                    isCustom: true
                });

                input.value = '';
                this.renderChecklistUI();
            }

            removeCustomChecklistItem(id) {
                this.state.activeChecklist = this.state.activeChecklist.filter(i => i.id !== id);
                this.renderChecklistUI();
            }

            async saveCar(e) {
                e.preventDefault();
                const id = document.getElementById('car-id').value;
                const carData = {
                    brand: document.getElementById('car-brand').value.trim(),
                    model: document.getElementById('car-model').value.trim(),
                    plate: document.getElementById('car-plate').value.trim(), 
                    km: document.getElementById('car-km').value,
                    status: document.getElementById('car-status').value,
                    notes: document.getElementById('car-notes').value.trim(),
                    checklist: this.state.activeChecklist,
                    updatedAt: Date.now()
                };

                if (this.state.isOnline && this.state.auth.currentUser) {
                    try {
                        const colRef = this.getCollectionRef();
                        if (id) {
                            await updateDoc(doc(this.state.db, colRef.path, id), carData);
                            this.showToast("Guardado", "success");
                        } else {
                            carData.createdAt = Date.now();
                            await addDoc(colRef, carData);
                            this.showToast("Registrado", "success");
                        }
                    } catch (error) {
                        this.showToast("Error al guardar", "error");
                    }
                } else {
                    if (id) {
                        const idx = this.state.cars.findIndex(c => c.id === id);
                        if (idx !== -1) this.state.cars[idx] = { ...this.state.cars[idx], ...carData };
                    } else {
                        carData.id = Date.now().toString();
                        carData.createdAt = Date.now();
                        this.state.cars.unshift(carData);
                    }
                    this.renderMechanicCars();
                    this.showToast("Guardado local", "success");
                }
                this.toggleCarModal();
            }

            editCar(id) {
                const car = this.state.cars.find(c => c.id === id);
                if (!car) return;
                
                document.getElementById('car-id').value = car.id;
                document.getElementById('car-brand').value = car.brand || '';
                document.getElementById('car-model').value = car.model || '';
                document.getElementById('car-plate').value = car.plate || '';
                document.getElementById('car-km').value = car.km || '';
                document.getElementById('car-status').value = car.status || 'En espera';
                document.getElementById('car-notes').value = car.notes || '';
                
                document.getElementById('modal-title').textContent = 'Editar Vehículo';
                this.state.activeChecklist = car.checklist && car.checklist.length > 0 
                    ? JSON.parse(JSON.stringify(car.checklist)) 
                    : JSON.parse(JSON.stringify(DEFAULT_CHECKLIST));
                
                this.renderChecklistUI();
                this.toggleCarModal();
            }

            async deleteCar(id) {
                this.state.cars = this.state.cars.filter(c => c.id !== id);
                if (this.state.isOnline && this.state.auth.currentUser) {
                    try {
                        await deleteDoc(doc(this.state.db, this.getCollectionRef().path, id));
                        this.showToast("Eliminado", "success");
                    } catch (e) {}
                } else {
                    this.renderMechanicCars();
                }
            }

            async updateCarStatus(id, newStatus) {
                const car = this.state.cars.find(c => c.id === id);
                if (car) car.status = newStatus;

                if (this.state.isOnline && this.state.auth.currentUser) {
                    try {
                        await updateDoc(doc(this.state.db, this.getCollectionRef().path, id), { status: newStatus, updatedAt: Date.now() });
                        this.showToast("Estado actualizado", "success");
                    } catch (e) {}
                }
            }

            openFichaModal(carId) {
                const car = this.state.cars.find(c => c.id === carId);
                if (!car) return;

                this.state.activeFichaCar = car;
                this.state.generatedImage = null;
                this.populateFichaCard(car);
                this.resetFichaButtonsState();
                
                const modal = document.getElementById('ficha-modal');
                modal.classList.remove('hidden');
                setTimeout(() => modal.classList.remove('opacity-0', 'pointer-events-none'), 10);
            }

            populateFichaCard(car) {
                const today = new Date().toLocaleDateString('es-UY', { day: '2-digit', month: '2-digit', year: 'numeric' });
                document.getElementById('ft-date').textContent = `Fecha: ${today}`;
                document.getElementById('ft-ref').textContent = Math.floor(1000 + Math.random() * 9000);
                document.getElementById('ft-vehicle').textContent = `${car.brand} ${car.model}`;
                document.getElementById('ft-plate').textContent = car.plate;
                document.getElementById('ft-km').textContent = car.km ? `${car.km} km` : 'Sin datos';
                
                const notesContainer = document.getElementById('ft-notes-container');
                if (car.notes) {
                    document.getElementById('ft-notes').textContent = car.notes;
                    notesContainer.classList.remove('hidden');
                } else {
                    notesContainer.classList.add('hidden');
                }

                const listServis = document.getElementById('ft-servis-list');
                const listReparaciones = document.getElementById('ft-reparaciones-list');
                listServis.innerHTML = '';
                listReparaciones.innerHTML = '';

                const checklist = car.checklist || DEFAULT_CHECKLIST;
                const selectedServis = checklist.filter(i => i.category === 'servis' && i.selected);
                const selectedReparaciones = checklist.filter(i => i.category === 'reparaciones' && i.selected);

                if (selectedServis.length === 0) {
                    listServis.innerHTML = '<p class="text-xs text-gray-500 italic">Sin registros.</p>';
                } else {
                    selectedServis.forEach(item => listServis.appendChild(this.createFichaItemBadge(item)));
                }

                if (selectedReparaciones.length === 0) {
                    listReparaciones.innerHTML = '<p class="text-xs text-gray-500 italic">Sin registros.</p>';
                } else {
                    selectedReparaciones.forEach(item => listReparaciones.appendChild(this.createFichaItemBadge(item)));
                }
            }

            createFichaItemBadge(item) {
                const el = document.createElement('div');
                const isComplete = item.status === 'completa';
                el.className = "flex items-start justify-between bg-gray-50 p-2 rounded border border-gray-300 gap-2 text-xs";
                el.innerHTML = `
                    <span class="text-black font-semibold break-words flex-grow">${item.text}</span>
                    <span class="px-2 py-0.5 rounded text-[10px] font-black flex-shrink-0 ${isComplete ? 'bg-black text-white' : 'bg-gray-200 text-black border border-black'}">
                        ${isComplete ? 'COMPLETA' : 'PENDIENTE'}
                    </span>
                `;
                return el;
            }

            resetFichaButtonsState() {
                const btnView = document.getElementById('btn-view-image');
                const btnShare = document.getElementById('btn-share-whatsapp');
                if (btnView && btnShare) {
                    btnView.classList.add('opacity-50', 'cursor-not-allowed', 'pointer-events-none');
                    btnShare.classList.add('opacity-50', 'cursor-not-allowed', 'pointer-events-none');
                }
            }

            async generateFichaImage() {
                const card = document.getElementById('ficha-tecnica-card');
                if (!card) return;

                this.showToast("Generando...", "info");

                try {
                    const canvas = await html2canvas(card, { backgroundColor: '#ffffff', scale: 2 });
                    const dataUrl = canvas.toDataURL('image/png');
                    const response = await fetch(dataUrl);
                    const blob = await response.blob();
                    
                    const car = this.state.activeFichaCar || { plate: 'Cliente' };
                    const fileName = `Ficha_${(car.plate || 'ElYama').replace(/\s+/g, '_')}.png`;
                    const file = new File([blob], fileName, { type: 'image/png' });

                    this.state.generatedImage = { dataUrl, blob, file, fileName };

                    document.getElementById('btn-view-image').classList.remove('opacity-50', 'cursor-not-allowed', 'pointer-events-none');
                    document.getElementById('btn-share-whatsapp').classList.remove('opacity-50', 'cursor-not-allowed', 'pointer-events-none');

                    this.showToast("Imagen generada", "success");
                } catch (error) {
                    this.showToast("Error al procesar", "error");
                }
            }

            openImageViewer() {
                if (!this.state.generatedImage) return;
                document.getElementById('viewer-img').src = this.state.generatedImage.dataUrl;
                const modal = document.getElementById('image-viewer-modal');
                modal.classList.remove('hidden');
                setTimeout(() => modal.classList.remove('opacity-0', 'pointer-events-none'), 10);
            }

            closeImageViewer() {
                const modal = document.getElementById('image-viewer-modal');
                modal.classList.add('opacity-0', 'pointer-events-none');
                setTimeout(() => modal.classList.add('hidden'), 300);
            }

            downloadGeneratedImage() {
                if (!this.state.generatedImage) return;
                const link = document.createElement('a');
                link.download = this.state.generatedImage.fileName;
                link.href = this.state.generatedImage.dataUrl;
                link.click();
            }

            async shareFichaImageWhatsApp() {
                if (!this.state.generatedImage) return;

                const car = this.state.activeFichaCar || { brand: 'Vehículo', model: '', plate: '' };
                const { file, dataUrl, fileName } = this.state.generatedImage;
                const textSummary = `*TALLER EL YAMA*\n🚗 ${car.brand} ${car.model}\n👤 ${car.plate}\n📌 Ficha Técnica de Servicio`;

                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    try {
                        await navigator.share({ files: [file], title: 'Ficha Técnica', text: textSummary });
                        return;
                    } catch (e) {
                        if (e.name === 'AbortError') return;
                    }
                }

                const link = document.createElement('a');
                link.download = fileName;
                link.href = dataUrl;
                link.click();

                try {
                    await navigator.clipboard.writeText(textSummary);
                } catch (e) {}

                this.showToast("Imagen descargada. Abre WhatsApp.", "info");
                setTimeout(() => {
                    window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(textSummary)}`, '_blank');
                }, 500);
            }

            closeFichaModal() {
                const modal = document.getElementById('ficha-modal');
                modal.classList.add('opacity-0', 'pointer-events-none');
                setTimeout(() => modal.classList.add('hidden'), 300);
            }

            async handleChat(e) {
                e.preventDefault();
                const inputEl = document.getElementById('chat-input');
                const prompt = inputEl.value.trim();
                const btn = document.getElementById('chat-submit-btn');
                if (!prompt || btn.disabled) return;

                this.addChatMessage(prompt, 'user');
                inputEl.value = '';
                btn.disabled = true;

                if (!Array.isArray(this.state.chatHistory)) this.state.chatHistory = [];
                this.state.chatHistory.push({ role: 'user', text: prompt });

                try {
                    const response = await fetch('https://text.pollinations.ai/' + encodeURIComponent(`Responde como mecánico de Taller El Yama en español rioplatense breve: ${prompt}`) + '?model=openai&private=true');
                    const reply = (await response.text()).trim();
                    this.addChatMessage(reply, 'ai');
                } catch (error) {
                    this.addChatMessage('Servicio no disponible en este momento.', 'ai');
                } finally {
                    btn.disabled = false;
                }
            }

            addChatMessage(text, sender) {
                const chatContainer = document.getElementById('chat-messages');
                if (!chatContainer) return;

                const wrap = document.createElement('div');
                wrap.className = `flex flex-col ${sender === 'user' ? 'items-end' : 'items-start'} mb-2`;
                
                const bubble = document.createElement('div');
                bubble.className = `px-3.5 py-2 max-w-[85%] text-xs ${sender === 'user' ? 'bg-amber-500 text-slate-950 font-medium rounded-2xl rounded-tr-sm' : 'bg-slate-700 text-white rounded-2xl rounded-tl-sm'} break-words`;
                bubble.textContent = String(text ?? '');
                
                wrap.appendChild(bubble);
                chatContainer.appendChild(wrap);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }

            getStatusColor(status) {
                switch(status) {
                    case 'En espera': return { bg: 'bg-red-500', badgeBg: 'bg-red-500/10', badgeText: 'text-red-400' };
                    case 'En proceso': return { bg: 'bg-amber-500', badgeBg: 'bg-amber-500/10', badgeText: 'text-amber-400' };
                    case 'Terminado': return { bg: 'bg-green-500', badgeBg: 'bg-green-500/10', badgeText: 'text-green-400' };
                    default: return { bg: 'bg-slate-500', badgeBg: 'bg-slate-500/10', badgeText: 'text-slate-400' };
                }
            }

            showToast(message, type = 'info') {
                const toast = document.createElement('div');
                toast.className = 'toast';
                toast.textContent = message;
                this.toastContainer.appendChild(toast);
                setTimeout(() => toast.classList.add('show'), 10);
                setTimeout(() => {
                    toast.classList.remove('show');
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            }
        }

        window.app = new App();
    </script>
</body>
</html>
